services:
  - type: web
    name: ultron-ai-backend
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: GROK_MODEL
        value: grok-2-latest
      - key: FISH_REFERENCE_ID
        value: e58b0d70f0a64006b53b85e05452f1e4
      - key: FRONTEND_ORIGIN
        value: https://eswaraitechnology.github.io
      - key: GEMINI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FISH_API_KEY
        sync: false
